{% extends "base.html" %}
{% block content %}

<h1 class="page-title">Профиль пользователя</h1>

<section class="card" style="max-width:640px;">
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label class="field-label" for="name">Имя</label>
        <input id="name" type="text" name="name" class="input-field" value="{{ current_user.name }}" required>

        <label class="field-label" for="username">Логин для входа</label>
        <input id="username" type="text" name="username" class="input-field" value="{{ current_user.username or '' }}" pattern="[a-z0-9_.-]{3,50}" title="3-50 символов: латиница, цифры, точка, подчёркивание или дефис" required>

        <label class="field-label" for="telegram">Контакт для связи (Telegram / VK / WhatsApp / телефон)</label>
        <input id="telegram" type="text" name="telegram" class="input-field" value="{{ current_user.telegram or '' }}" placeholder="@username, vk.com/..., +7...">

        <label class="field-label" for="avatar">Аватарка (PNG/JPG/WEBP/GIF)</label>
        <div class="profile-avatar-row">
            {% if user_avatar_url %}<img src="{{ user_avatar_url }}" class="profile-avatar-preview" alt="Текущая аватарка">{% endif %}
            <input id="avatar" type="file" name="avatar" class="input-field" accept="image/png,image/jpeg,image/webp,image/gif">
        </div>

        <hr style="border-color:rgba(255,255,255,0.12);margin:18px 0;">
        <h2 style="margin-bottom:12px;">Смена пароля</h2>
        <p class="muted-text" style="margin-bottom:12px;">Оставьте поля пустыми, если пароль менять не нужно.</p>
        <input type="password" name="current_password" class="input-field" placeholder="Текущий пароль">
        <input type="password" name="new_password" class="input-field" placeholder="Новый пароль" minlength="6">
        <input type="password" name="confirm_password" class="input-field" placeholder="Повторите новый пароль" minlength="6">

        <button type="submit" class="btn">Сохранить профиль</button>
    </form>
</section>

{% endblock %}
