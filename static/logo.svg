<?xml version="1.0" encoding="UTF-8"?>
<svg width="292" height="78" viewBox="0 0 292 78" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StudentHubik</title>
  <desc id="desc">Premium minimal StudentHubik SH wordmark</desc>
  <defs>
