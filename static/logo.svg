  <text x="88" y="63" font-family="Inter, Manrope, Arial, sans-serif" font-size="9.5" font-weight="850" letter-spacing="3.2" fill="#475569" stroke="#FFFFFF" stroke-width="1.15" paint-order="stroke fill">ACADEMIC OS</text>
