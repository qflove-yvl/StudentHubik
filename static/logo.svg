      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="word" x1="86" y1="16" x2="282" y2="58" gradientUnits="userSpaceOnUse">
